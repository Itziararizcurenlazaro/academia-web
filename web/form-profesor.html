<!DOCTYPE html>
<html>
<head>
    <title>Alta Profesor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Nuevo Profesor</h2>

<form action="alta-profesor" method="post">

<input name="nombre" class="form-control mb-2" placeholder="Nombre" required>
<input name="email" type="email" class="form-control mb-2" placeholder="Email" required>

<input name="apellidos" class="form-control mb-2" placeholder="Apellidos">
<input name="especialidad" class="form-control mb-2" placeholder="Especialidad">

<input type="date" name="fecha_contratacion" class="form-control mb-2">

<input name="salario" type="number" step="0.01" class="form-control mb-2" placeholder="Salario">

<select name="activo" class="form-control mb-2">
<option value="1">Activo</option>
<option value="0">Inactivo</option>
</select>

<input name="id_supervisor" type="number" class="form-control mb-2" placeholder="ID Supervisor">


<button class="btn btn-primary">Guardar</button>

</form>

</body>
</html>
