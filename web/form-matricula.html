<!DOCTYPE html>
<html>
<head>
    <title>Alta Matricula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Nueva Matricula</h2>

<form action="alta-matricula" method="post">

<input type="date" name="fecha_matricula" class="form-control mb-2">

<select name="estado" class="form-control mb-2">
<option>activa</option>
<option>cancelada</option>
<option>finalizada</option>
</select>

<select name="pagado" class="form-control mb-2">
<option value="1">Pagado</option>
<option value="0">No pagado</option>
</select>

<input name="nota_final" class="form-control mb-2">
<input name="importe_total" class="form-control mb-2">

<select name="metodo_pago" class="form-control mb-2">
<option>efectivo</option>
<option>tarjeta</option>
<option>transferencia</option>
</select>

<input type="date" name="fecha_baja" class="form-control mb-2">

<input name="id_alumno" class="form-control mb-2" placeholder="ID Alumno" required>
<input name="id_curso" class="form-control mb-2" placeholder="ID Curso" required>

<button class="btn btn-primary">Guardar</button>

</form>

</body>
</html>
