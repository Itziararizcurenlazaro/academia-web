<!DOCTYPE html>
<html>
<head>
    <title>Nueva Matricula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/flatly/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Nueva Matricula</h2>

<form action="alta-matricula" method="post">

<input type="date" name="fecha_matricula" class="form-control mb-2" required>

<select name="estado" class="form-control mb-2">
<option value="activa">Activa</option>
<option value="cancelada">Cancelada</option>
<option value="finalizada">Finalizada</option>
</select>

<select name="pagado" class="form-control mb-2">
<option value="1">Pagado</option>
<option value="0">No pagado</option>
</select>

<input name="nota_final" class="form-control mb-2" placeholder="Nota final">

<input name="importe_total" class="form-control mb-2" placeholder="Importe total">

<select name="metodo_pago" class="form-control mb-2">
<option value="efectivo">Efectivo</option>
<option value="tarjeta">Tarjeta</option>
<option value="transferencia">Transferencia</option>
</select>

<input type="date" name="fecha_baja" class="form-control mb-2">

<input name="id_alumno" class="form-control mb-2" placeholder="ID Alumno" required>
<input name="id_curso" class="form-control mb-2" placeholder="ID Curso" required>

<button class="btn btn-primary">Guardar</button>

</form>

</body>
</html>
