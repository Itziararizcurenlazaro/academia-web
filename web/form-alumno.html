<!DOCTYPE html>
<html>
<head>
    <title>Alta Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>Nuevo Alumno</h2>

<form action="alta-alumno" method="post" enctype="multipart/form-data">

<input name="nombre" class="form-control mb-2" placeholder="Nombre" required>
<input name="email" type="email" class="form-control mb-2" placeholder="Email" required>

<input name="apellidos" class="form-control mb-2" placeholder="Apellidos">
<input name="password" class="form-control mb-2" placeholder="Password">
<input name="telefono" class="form-control mb-2" placeholder="Telefono">
<input name="direccion" class="form-control mb-2" placeholder="Direccion">

<input type="date" name="fecha_nacimiento" class="form-control mb-2">

<select name="nivel" class="form-control mb-2">
<option>principiante</option>
<option>intermedio</option>
<option>avanzado</option>
</select>

<select name="rol" class="form-control mb-2">
<option>alumno</option>
<option>admin</option>
</select>

<select name="activo" class="form-control mb-2">
<option value="1">Sí</option>
<option value="0">No</option>
</select>

<input type="file" name="foto" class="form-control mb-3">

<button class="btn btn-primary">Guardar</button>

</form>

</body>
</html>
